AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Rota Vital - funcao serverless que gera a guia de transporte

Globals:
  Function:
    Timeout: 10   # segundos; usado no Passo 5 (depois trocar para 10)

Resources:
  GuiaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 128
      Events:
        Guias:
          Type: Api
          Properties:
            Path: /guias
            Method: post

Outputs:
  GuiasApi:
    Description: URL do API Gateway (stage Prod)
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/guias/"
